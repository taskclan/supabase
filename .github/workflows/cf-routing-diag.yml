# Hand cloud.taskclan.com to the console by removing the Worker route that
# still sends it to the engine.
#
# The diagnostic run of this workflow found the cause. Everything configured for
# the cutover was already correct:
#
#   custom domain : cloud.taskclan.com -> taskclan-cloud-console  (correct)
#   DNS           : AAAA -> 100:: proxied                          (the custom
#                   domain's own placeholder record, correct)
#   SaaS hostnames: none
#
# but the zone also carried a Worker ROUTE:
#
#   cloud.taskclan.com/*   ->   tc-svc-15e5304f77a840b18417d80806b95f97
#
# tc-svc-* is Taskclan Cloud's service-worker naming, so that is the engine
# running as a Cloud app, and the route wins over the custom domain. It is also
# why deleting the hostname's old DNS record did not stop the engine serving it:
# a route matches on hostname and does not care what the record points at.
#
# Deleting that one route is the entire remaining cutover step.
#
# Guardrails, because this mutates production routing:
#   - only a pattern matching EXACTLY "cloud.taskclan.com/*" is touched
#   - it aborts if that pattern is missing or appears more than once
#   - platform.taskclan.com/*, taskclan.com/* and every other tc-svc-* route
#     are left alone; they are different hostnames on the same zone
#
# Reversing it: recreate the route with
#   POST /zones/<zone>/workers/routes {"pattern":"cloud.taskclan.com/*",
#     "script":"tc-svc-15e5304f77a840b18417d80806b95f97"}
# Both the pattern and the script id are recorded above so a rollback needs
# nothing but this file.
name: CF routing cutover

on:
  workflow_dispatch:
  push:
    branches: [taskclan/sitterly-theme]
    paths:
      - '.github/workflows/cf-routing-diag.yml'

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove the engine's route for cloud.taskclan.com
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api() { curl -sS -X "${2:-GET}" -H "Authorization: Bearer $CF_TOKEN" -H "content-type: application/json" "https://api.cloudflare.com/client/v4$1"; }

          TARGET='cloud.taskclan.com/*'

          ZONE=$(api "/zones?name=taskclan.com" | jq -r '.result[0].id // empty')
          [ -n "$ZONE" ] || { echo "could not read the zone"; exit 1; }

          echo "### routes before"
          ROUTES=$(api "/zones/$ZONE/workers/routes")
          echo "$ROUTES" | jq -r '.result[]? | "  \(.pattern) -> \(.script // "-")"'

          N=$(echo "$ROUTES" | jq --arg p "$TARGET" '[.result[]? | select(.pattern == $p)] | length')
          if [ "$N" != "1" ]; then
            echo
            echo "expected exactly one route with pattern '$TARGET', found $N. Doing nothing."
            exit 1
          fi

          ID=$(echo "$ROUTES"    | jq -r --arg p "$TARGET" '.result[] | select(.pattern == $p) | .id')
          SCRIPT=$(echo "$ROUTES" | jq -r --arg p "$TARGET" '.result[] | select(.pattern == $p) | .script')
          echo
          echo "### deleting"
          echo "  pattern : $TARGET"
          echo "  script  : $SCRIPT   (recreate with this id if rolling back)"

          RES=$(api "/zones/$ZONE/workers/routes/$ID" DELETE)
          OK=$(echo "$RES" | jq -r '.success')
          if [ "$OK" != "true" ]; then
            echo "delete failed:"; echo "$RES" | jq -r '.errors'; exit 1
          fi
          echo "  deleted."

          echo
          echo "### routes after"
          api "/zones/$ZONE/workers/routes" | jq -r '.result[]? | "  \(.pattern) -> \(.script // "-")"'

          echo
          echo "### who serves cloud.taskclan.com now"
          sleep 10
          CODE=$(curl -sS -m 15 -o /tmp/body.txt -w '%{http_code}' https://cloud.taskclan.com/api/taskclan/keys || true)
          echo "  /api/taskclan/keys -> $CODE"
          echo "  body: $(head -c 120 /tmp/body.txt | tr -d '\n')"
          echo "  (the console answers 401 with JSON 'sign in to use this console';"
          echo "   the engine answers 404 with HTML)"
