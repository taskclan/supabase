# A minimal Cloudflare container, to answer one question.
#
# The console's image is proven to serve under Docker — including with CMD
# cleared, the way Cloudflare starts it — and still exits 0 on Cloudflare with
# nothing on stdout. That leaves two possibilities that no amount of reading
# the console's own logs can separate: the platform never runs the entrypoint,
# or it runs it and the app exits.
#
# This deploys the smallest container that can tell them apart: same base image,
# same instance type, same port, an explicit ENTRYPOINT and no application. If
# it serves, the fault is in the console image and this stays as a control. If
# it exits too, this is a reproduction small enough to hand to Cloudflare.
#
# Runs only on demand, and deploys to its own Worker so it cannot disturb the
# console.
name: Probe container

# workflow_dispatch alone is not enough: GitHub only offers it for workflows
# present on the DEFAULT branch, and this fork's default is upstream Supabase's.
# A push trigger scoped to this directory is the one that actually fires here.
on:
  workflow_dispatch:
  push:
    branches: [taskclan/sitterly-theme]
    paths:
      - 'deploy/probe/**'
      - '.github/workflows/probe-container.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build and run it here first
        timeout-minutes: 5
        run: |
          docker build -f deploy/probe/Dockerfile -t probe:test .
          docker inspect -f 'Entrypoint={{json .Config.Entrypoint}} Cmd={{json .Config.Cmd}}' probe:test
          docker run -d --name probe-smoke -p 8080:8080 probe:test
          sleep 8
          docker logs probe-smoke 2>&1 | tail -10
          code=$(curl -sS -m 10 -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo 000)
          docker rm -f probe-smoke >/dev/null 2>&1 || true
          echo "local probe -> HTTP $code"
          [ "$code" = "200" ] || { echo "the probe itself is broken"; exit 1; }

      - name: Deploy the probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: deploy/probe
        # The Worker imports @cloudflare/containers and wrangler bundles it, so
        # it has to be resolvable from here. This workflow deliberately skips
        # the repo's pnpm install — the point is a build with nothing else in
        # it — so install the one dependency directly.
        run: |
          # deploy/probe carries its own package.json so npm installs here
          # instead of walking up into the pnpm workspace root, whose
          # `catalog:` versions npm cannot parse.
          npm i --no-audit --no-fund
          npx --yes wrangler@latest deploy --config wrangler.jsonc
