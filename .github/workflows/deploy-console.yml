# Deploy the Taskclan Cloud console straight to Cloudflare.
#
# Why this exists rather than deploying through Taskclan Cloud: the console IS
# the control plane's UI. Shipping it through the control plane's own builder
# means you cannot deploy the console when Cloud is broken — the wrong
# dependency direction for infrastructure — and it put a very large Next build
# through a pipeline budgeted for five-minute tenant apps.
#
# Four attempts on that path failed on the runner rather than on the app: a
# 60-minute ceiling, a build cache whose paths never matched a pnpm workspace,
# and a compile that sits right at the memory limit of a 16 GB runner. Here the
# runner, the timeout and the cache are ours to set.
name: Deploy console

on:
  workflow_dispatch:
  push:
    branches: [taskclan/sitterly-theme]
    paths:
      - 'apps/studio/**'
      - 'packages/**'
      - 'deploy/**'
      # The container probe lives under deploy/ but ships nothing to the
      # console; rebuilding studio for it wastes seven minutes a push.
      - '!deploy/probe/**'
      - 'wrangler.jsonc'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-console.yml'

# One deploy at a time. Queue rather than cancel: a run partway through
# `wrangler deploy` is the last thing that should be interrupted.
concurrency:
  group: deploy-console
  cancel-in-progress: false

jobs:
  deploy:
    # ubuntu-latest, deliberately, despite an 8-core runner existing.
    #
    # GitHub's larger runners refuse PUBLIC repositories by default, and this is
    # a public fork of supabase/supabase. A job that asks for one is not
    # rejected — it queues forever. Moving ubuntu-8core into a group that allows
    # public repos is the permanent fix and drops this build to ~15 minutes;
    # until then a standard runner is the one that actually picks the job up.
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # pnpm via corepack rather than pnpm/action-setup. This org allows only
      # GitHub-owned actions (verified_allowed: false, patterns_allowed: []), so
      # a third-party action fails the run at startup before any step exists —
      # with no job to inspect, which makes it look like a broken workflow file.
      # corepack reads packageManager from package.json, so the version stays
      # pinned by the repo rather than by a workflow input.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # The pnpm store, cached by hand because setup-node's `cache: pnpm` needs
      # pnpm on PATH before setup-node runs — which corepack cannot do earlier
      # without a Node to run it.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Restore the pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Next's incremental cache. In a pnpm workspace it lives under the app, not
      # at the repo root — the path that tripped up Cloud's builder, where every
      # monorepo deploy recompiled from scratch while reporting a cache step that
      # matched nothing. Keyed per run so each build writes a fresh entry, with a
      # prefix restore so the newest one is reused.
      - name: Restore the Next build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/studio/.next/cache
            .turbo
          key: console-next-${{ github.run_id }}
          restore-keys: console-next-

      - name: Build studio
        env:
          # No NODE_OPTIONS. Raising the heap is what killed this build, not what
          # saved it: on a 16 GB runner, 12288 MB OOM-killed the runner at 23
          # minutes and 8192 MB at 9. The default heap is the only setting
          # observed to survive — it compiled for 57 minutes and was still
          # healthy when a 60-minute ceiling (since raised to 120) stopped it.
          #
          # V8 collects more often under a smaller old space, which is slow but
          # recoverable. Being OOM-killed at the process level is not.
          NEXT_TELEMETRY_DISABLED: '1'
          # build:next otherwise uploads assets to Supabase's own CDN.
          SKIP_ASSET_UPLOAD: '1'
          # Per-user auth. NEXT_PUBLIC_* is inlined by Next at build time, which
          # is why these live here and not in wrangler.jsonc: turning auth ON
          # needs a rebuild. Turning the OLD path off is TASKCLAN_SHARED_KEY_FALLBACK,
          # deliberately a runtime Worker variable so a rollback does not wait on one.
          #
          # Repo variables rather than secrets: the project URL is public and the
          # anon key already ships in every client bundle, so neither is secret,
          # but keeping them out of git means switching projects is a settings
          # change rather than a commit.
          #
          # Unset, both arrive as empty strings, TASKCLAN_AUTH_ENABLED is false,
          # and the console builds exactly as it does today. That is the off
          # switch: auth is enabled by setting these, not by shipping code.
          NEXT_PUBLIC_TASKCLAN_AUTH_URL: ${{ vars.TASKCLAN_AUTH_URL }}
          NEXT_PUBLIC_TASKCLAN_AUTH_ANON_KEY: ${{ vars.TASKCLAN_AUTH_ANON_KEY }}
        run: |
          pnpm turbo run build --filter='studio^...'
          pnpm --filter studio exec next build
          node scripts/taskclan-standalone.mjs
          # Stage the built tree somewhere shallow. The root .dockerignore
          # carries **/.next and **/node_modules — both correct for upstream,
          # both fatal for an image whose entire content is the traced server.
          # Copying to deploy/app means the context rules stay simple instead of
          # alternating include/exclude down four levels of an ignored path.
          rm -rf deploy/app
          mkdir -p deploy/app
          cp -a apps/studio/.next/standalone/. deploy/app/
          # pg-meta ships inside the image, beside the console.
          #
          # Studio's database screens are not self-contained: the Table editor,
          # the SQL editor and every schema view proxy through pg-meta over
          # HTTP. It is not a Studio dependency, so Next's tracing does not pull
          # it into the standalone output, and without this step the console
          # starts and every database screen fails against a pg-meta that isn't
          # there — which is how it would have shipped.
          #
          # Pinned: pg-meta's API moves with the Postgres version it targets,
          # and a floating version would change the console's behaviour on an
          # unrelated deploy.
          npm i --prefix deploy/app/pgmeta --omit=dev --no-audit --no-fund @supabase/postgres-meta@0.99.0
          test -f deploy/app/pgmeta/node_modules/@supabase/postgres-meta/dist/server/server.js \
            || { echo 'pg-meta did not install'; exit 1; }

          echo "staged $(du -sh deploy/app | cut -f1) to deploy/app"
          test -f deploy/app/apps/studio/server.js || { echo 'server.js missing from staged tree'; exit 1; }

      # wrangler builds deploy/Dockerfile, pushes the image to Cloudflare's
      # registry and rolls the container. Docker is present on GitHub runners.
      # Three runs failed with "failed to compute cache key" and I read it three
      # different ways, all wrong. It means the path is not in the build context.
      # This prints what the context actually contains, so the next failure is
      # evidence rather than another guess.
      - name: Show what the image will be built from
        run: |
          echo "--- deploy/ ---"; ls -la deploy/
          echo "--- deploy/app (top) ---"; ls -la deploy/app/ | head -10
          echo "--- server entry ---"; ls -l deploy/app/apps/studio/server.js
          echo "--- the ignore file that will apply ---"
          # Only one can, now that the context is deploy/. Printing it is not
          # decoration: two ignore files in play is precisely what let CI and
          # wrangler build different images. `|| true` because a missing file
          # must not become the step's exit status — that is how this step
          # failed the build the first time.
          for f in deploy/.dockerignore .dockerignore; do
            if [ -f "$f" ]; then echo "== $f"; grep -vE '^[[:space:]]*#|^[[:space:]]*$' "$f" || true; fi
          done
          echo "--- context size wrangler will transfer ---"
          du -sh deploy | cut -f1

      # Run the image here before shipping it. The edge only ever says "the
      # container just exited", which cannot distinguish a missing binary from
      # an app that threw — several deploys went on inference because of it.
      # The runner has Docker, so the container's own stdout is available for
      # the cost of one step.
      # Does the image contain the app at all?
      #
      # This is the check whose absence cost a day. CI built the image with the
      # docker CLI, which honours deploy/Dockerfile.dockerignore, and got
      # 765.78 MB that served. wrangler built it with the context root's
      # .dockerignore — upstream Supabase's, excluding **/node_modules and
      # **/.next — and got 40.77 kB with no Next in it. Same run, same
      # Dockerfile, two different images, and every test here passed on the one
      # that was not being deployed.
      #
      # Resolving `next` from inside the image is the cheapest question that
      # separates them, and it fails loudly instead of at the edge with
      # "the container is not running".
      - name: The image must actually contain the app
        timeout-minutes: 6
        run: |
          docker build -f deploy/Dockerfile -t console:test deploy
          docker run --rm --entrypoint node console:test -e "
            const { createRequire } = require('module')
            const req = createRequire('/app/apps/studio/server.js')
            const fs = require('fs')
            for (const p of ['/app/apps/studio/.next/BUILD_ID', '/app/apps/studio/public', '/app/node_modules']) {
              const ok = fs.existsSync(p)
              console.log((ok ? 'ok   ' : 'MISS ') + p)
              if (!ok) { console.error('image is missing ' + p); process.exit(1) }
            }
            console.log('next resolves ->', req.resolve('next'))
          "

      - name: Smoke-test the image
        timeout-minutes: 8
        run: |
          docker build -f deploy/Dockerfile -t console:test deploy
          echo "--- layout inside the image ---"
          # --entrypoint, because the image's ENTRYPOINT is the server itself.
          # Without it these arguments are passed TO the entrypoint script,
          # which ignores them and starts Next in the foreground — the step then
          # blocks until the job times out, 12 minutes of which were spent
          # learning this.
          docker run --rm --entrypoint sh console:test -c 'pwd; echo; ls -la; echo; ls -la /app | head -20; node -v'
          echo "--- start it for real ---"
          docker run -d --name console-smoke -p 8080:8080 -e PORT=8080 console:test
          sleep 20
          echo "--- container stdout ---"
          docker logs console-smoke 2>&1 | tail -40
          echo "--- is it listening? ---"
          code=$(curl -sS -m 15 -o /tmp/smoke.html -w '%{http_code}' http://localhost:8080/ || echo 000)
          echo "local probe -> HTTP $code"
          # pg-meta answers on loopback inside the container, so ask from
          # inside — and ask with node, which is certainly present. node:22-slim
          # is Debian slim and carries no curl guarantee; probing with a tool
          # that may not exist reports "pg-meta is down" when it is fine.
          docker exec console-smoke node -e "
            fetch('http://127.0.0.1:8090/health')
              .then(r => console.log('pg-meta /health -> HTTP', r.status))
              .catch(e => console.log('pg-meta unreachable:', e.message))" || true
          docker rm -f console-smoke >/dev/null 2>&1 || true
          case "$code" in
            200|302|307) echo "image serves under Docker" ;;
            *) echo "IMAGE DOES NOT SERVE — not deploying a container that cannot start"; exit 1 ;;
          esac

      # The check above passes on images that are dead on Cloudflare.
      #
      # Docker starts ENTRYPOINT + CMD; Cloudflare starts the ENTRYPOINT and
      # drops the CMD. An image whose start command lives in CMD therefore
      # serves here and exits instantly there — node:22-slim's inherited shim
      # falls through to `exec node`, which reads its closed stdin as the
      # program and returns 0. The edge calls that "the container is not
      # running", so a green smoke test above shipped a container that never
      # came up, twice.
      #
      # Reproduce Cloudflare's semantics exactly: a derived image with CMD
      # cleared. If the entrypoint alone does not serve, the deploy stops here
      # rather than at the edge with an error that names no cause.
      - name: Smoke-test the image the way Cloudflare starts it
        timeout-minutes: 8
        run: |
          echo "--- declared start config ---"
          docker inspect -f 'Entrypoint={{json .Config.Entrypoint}}  Cmd={{json .Config.Cmd}}' console:test
          printf 'FROM console:test\nCMD []\n' | docker build -q -t console:cloudflare -
          docker run -d --name console-cf -p 8081:8080 -e PORT=8080 console:cloudflare
          sleep 20
          echo "--- container stdout (entrypoint only, no CMD) ---"
          docker logs console-cf 2>&1 | tail -20
          echo "--- exit state ---"
          docker inspect -f 'Running={{.State.Running}} ExitCode={{.State.ExitCode}}' console-cf
          code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' http://localhost:8081/ || echo 000)
          echo "entrypoint-only probe -> HTTP $code"
          docker rm -f console-cf >/dev/null 2>&1 || true
          case "$code" in
            200|302|307) echo "image serves with ENTRYPOINT alone — safe for Cloudflare" ;;
            *) echo "START COMMAND IS IN CMD, NOT ENTRYPOINT — Cloudflare will exit 0 on boot"; exit 1 ;;
          esac

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@latest deploy --config wrangler.jsonc
