<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 581 113" role="img" aria-label="Taskclan Cloud">
<!-- Taskclan wordmark lockup. Mark + live text: the type follows the app's
     font stack (Figtree, per the Sitterly tokens) rather than being outlined,
     so it cannot drift out of step with the design system. -->
<title>Taskclan Cloud</title>
<image xlink:href="data:image/png;base64," x="0" y="2" width="109" height="109" />
<text x="130" y="76" font-family="Figtree, ui-sans-serif, system-ui, -apple-system, sans-serif"
      font-size="74" font-weight="700" letter-spacing="-1.6" fill="currentColor">Taskclan</text>
</svg>
